persona:
  name: "Haymant"                 # TODO: confirm the sender name shown on emails
  company: "CloudBox99"
  role: "Business Development"
  # TODO: replace with the mailbox on your dedicated SENDING domain
  # (e.g. sales@getcloudbox99.com) — never your main cloudbox99.com address.
  email: "sales@your-sending-domain.com"
  linkedin: ""
  tone: "friendly, direct, technically credible — one founder-to-founder note, not a vendor pitch"

product:
  name: "CloudBox99 Cloud Servers"
  description: >-
    Affordable cloud VPS hosting (Linux and Windows) for Indian startups and
    SaaS teams, with free 24/7 support and a 99% uptime guarantee — at
    roughly half the cost of comparable AWS instances.
  pricing: "Linux VPS from Rs.899/mo, Windows VPS from Rs.1,299/mo"
  key_benefits:
    - "About 50% cheaper than comparable AWS instances"
    - "Free 24/7 support included on every plan"
    - "99% uptime guarantee"   # TODO: website says 99.9% — confirm which
    - "Simple monthly pricing in rupees"
    - "Linux (Rs.899/mo) and Windows (Rs.1,299/mo) servers"
  objection_responses:
    "too expensive": "Fair — that's usually what we hear before the comparison. Our Linux servers start at Rs.899/mo and typically come in around half of the equivalent AWS bill. Happy to price your current setup side by side."
    "already on aws": "Makes sense, most of the teams we talk to are. Not asking you to move everything — a lot of them start by shifting one staging or internal server and comparing the bill after a month."
    "already have a solution": "Totally fair. Curious — is it the bill, the support, or neither that you'd change if you could?"
    "migration is risky / no time": "Understood. That's why we'd start with a 7-day free trial on a non-critical server, so you can compare before moving anything that matters."
    "is support really free": "Yes — 24/7 support is included on every plan, no paid tier."
    "not interested": "No worries at all — I won't follow up again."
  offer:
    primary: "Cloud VPS — Linux from Rs.899/mo, Windows from Rs.1,299/mo"
    entry: "7-day free trial"
    goal: "start_trial"            # get them on the free trial, or onto a short call
    booking_method: "suggest_times" # no Calendly yet: propose 2-3 times for a Microsoft Teams call
    booking_url: ""                 # add a Calendly / Teams Bookings link here later if you get one
    meeting_duration: "15 minutes (Microsoft Teams)"
    meeting_owner: ""               # TODO: who takes the calls (name or role)

icp:
  industries:
    - "SaaS"
    - "Tech startup"
    - "Software development"
    - "Web and mobile app development"
  company_size: "5-200 employees"
  titles:
    - "CTO"
    - "Co-founder"
    - "Founder"
    - "VP Engineering"
    - "Head of Engineering"
    - "Engineering Manager"
    - "DevOps Lead"
  geography:
    - "Bengaluru, India"
    - "Pune, India"
    - "Hyderabad, India"
    - "Chennai, India"
    - "Gurugram, India"
    - "Noida, India"
    - "Mumbai, India"
  # A startup hiring for these roles is dealing with servers RIGHT NOW —
  # the strongest reason to email them this week.
  hiring_signals:
    - "devops engineer"
    - "cloud engineer"
    - "site reliability engineer"
    - "system administrator"
    - "aws engineer"

channels:
  email:
    enabled: true
    provider: "gmail"          # gmail (recommended) | smtp | instantly
    max_daily_sends: 20        # start low while the new sending domain warms up
    require_approval: true      # every email waits in the Outbox for a human
    send_to_risky: false        # also send to catch-all domains (off = safest)
    max_bounce_rate: 0.05       # pause all sending if bounces exceed this
  linkedin:
    enabled: false             # LinkedIn automation breaks LinkedIn's terms; keep off
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "20:00"
    end: "09:00"
    timezone: "Asia/Kolkata"
